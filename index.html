<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b7161b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="/assets/push-icon-192.png"><title>Команда, поехали!</title><link rel="stylesheet" href="/assets/app.css?v=9.2.3"></head><body><header class="top" data-ui-block="global.header"><button class="mobile-menu-toggle" onclick="openMobileMenu()" aria-label="Открыть меню"><span></span><span></span><span></span></button><button class="logo-home-btn" type="button" onclick="goHomeFromLogo()" aria-label="На главную" title="На главную"><img class="logo" src="/assets/logo.png" alt="Команда · Поехали!"></button><div class="brand"><b>КОМАНДА · ПОЕХАЛИ!</b><small>Новости, конкурсы и достижения</small></div><div style="margin-left:auto" id="who"></div></header><div id="mobileDrawer" class="mobile-drawer">
  <div class="mobile-drawer-backdrop" onclick="closeMobileMenu()"></div>
  <aside class="mobile-drawer-panel">
    <div class="mobile-drawer-head">
      <img src="/assets/logo.png">
      <b>Команда · Поехали!</b>
      <button class="mobile-drawer-close" onclick="closeMobileMenu()">×</button>
    </div>
    <div id="mobileMenuContent"></div>
  </aside>
</div>
<main class="wrap" id="app"></main>
<div id="tutorialOffer" class="tutorial-offer"></div>
<div id="tutorialOverlay" class="tutorial-overlay">
  <div id="tutorialCard" class="tutorial-card"></div>
</div>
<div id="quickCreateModal" class="crop-modal">
  <div class="crop-card quick-create-card">
    <div class="row"><b style="flex:1">Создание</b><button class="btn light" onclick="closeQuickCreate()">×</button></div>
    <div id="quickCreateBody"></div>
  </div>
</div>
<div id="cropModal" class="crop-modal">
  <div class="crop-card">
    <div class="row">
      <h3 style="margin:0;flex:1">Обрезка фотографии</h3>
      <button class="btn light" onclick="closeCropper()">×</button>
    </div>
    <div id="cropStage" class="crop-stage">
      <canvas id="cropCanvas"></canvas>
      <div class="crop-mask"></div>
    </div>
    <div class="crop-controls">
      <label>Масштаб</label>
      <input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1" oninput="updateCropTransform()">
      <p class="muted" style="margin:0">Перетаскивайте фото пальцем или мышью, чтобы выбрать нужную область.</p>
    </div>
    <div class="crop-actions">
      <button class="btn light" onclick="closeCropper()">Отмена</button>
      <button class="btn red" onclick="applyCrop()">Обрезать и сохранить</button>
    </div>
  </div>
</div><script src="/assets/app.js?v=9.2.3"></script></body></html>
