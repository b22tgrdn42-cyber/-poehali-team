<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Команда, поехали!</title><style>
:root{--red:#b91c1c;--sand:#edb861;--cream:#fff8e8;--ink:#171717;--muted:#6b6258}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#f6d99c,#fff8e8);color:var(--ink)}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:5;background:#fffaf0eF;backdrop-filter:blur(10px);border-bottom:4px solid var(--red);display:flex;align-items:center;gap:14px;padding:10px 4vw}.logo{width:64px;height:64px;object-fit:contain}.brand b{font-size:20px}.brand small{display:block;color:var(--muted)}.wrap{max-width:1180px;margin:auto;padding:22px}.card{background:#fffaf0;border:1px solid #ead7b3;border-radius:18px;padding:18px;box-shadow:0 8px 24px #5b341015;margin-bottom:16px}.hero{background:var(--sand);border:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button,.btn{border:0;border-radius:12px;padding:11px 14px;background:#171717;color:white;cursor:pointer}.tabs button.active,.btn.red{background:var(--red)}.btn.light{background:#fff;color:#171717;border:1px solid #d7c29d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{width:100%;padding:12px;border:1px solid #d8c49f;border-radius:10px;background:white;margin:5px 0 10px}.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#eee}.newsimg{width:100%;max-height:330px;object-fit:cover;border-radius:14px}.pill{display:inline-block;background:#171717;color:white;padding:4px 9px;border-radius:999px;font-size:12px}.muted{color:var(--muted)}.score{font-size:34px;font-weight:800;color:var(--red)}.hidden{display:none!important}.danger{background:#7f1d1d}.ok{background:#166534}.listitem{padding:12px 0;border-bottom:1px solid #ead7b3}.login{max-width:520px;margin:5vh auto}.loginlogo{width:220px;display:block;margin:auto}.bottom{display:none}.toast{position:fixed;right:16px;bottom:16px;background:#171717;color:white;padding:12px 16px;border-radius:12px;z-index:10}@media(max-width:720px){.wrap{padding:12px 12px 80px}.grid,.grid3{grid-template-columns:1fr}.top{padding:8px 12px}.logo{width:50px;height:50px}.brand b{font-size:16px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:8;background:#171717;padding:8px;justify-content:space-around}.bottom button{background:none;color:white;border:0;font-size:12px}.card{border-radius:14px}.tabs{overflow:auto;flex-wrap:nowrap}.tabs button{white-space:nowrap}}
</style></head><body><header class="top"><img class="logo" src="/assets/logo.png"><div class="brand"><b>КОМАНДА, ПОЕХАЛИ!</b><small>Геймификация и внутренние новости</small></div><div style="margin-left:auto" id="who"></div></header><main class="wrap" id="app"></main><script>
const A='/api/';let token=localStorage.token||'', role=localStorage.role||'', state=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(A+path,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Ошибка');return j}function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}function logout(){localStorage.clear();token='';role='';login()}
function file64(inp,cb){let f=inp.files[0];if(!f)return cb(null);if(f.size>900000)return toast('Фото должно быть меньше 900 КБ');let r=new FileReader;r.onload=()=>cb(r.result);r.readAsDataURL(f)}
async function login(){role='';$('#who').innerHTML='';let em=await api('public/employees');$('#app').innerHTML=`<div class="login card"><img class="loginlogo" src="/assets/logo.png"><h2>Вход в систему</h2><label>Сотрудник</label><select id="emp" class="field"><option value="">Выберите себя</option>${em.map(e=>`<option value="${e.id}">${esc(e.name)} — ${esc(e.position)}</option>`).join('')}</select><input id="pin" class="field" type="password" inputmode="numeric" placeholder="Индивидуальный PIN"><button class="btn red" onclick="empLogin()">Войти сотрудником</button><hr><h3>Управляющий</h3><input id="mpin" class="field" type="password" inputmode="numeric" placeholder="PIN управляющего"><button class="btn" onclick="mgrLogin()">Кабинет управляющего</button></div>`}
async function empLogin(){try{let j=await api('login/employee',{method:'POST',body:JSON.stringify({id:+$('#emp').value,pin:$('#pin').value})});token=j.token;role='employee';localStorage.token=token;localStorage.role=role;employee()}catch(e){toast(e.message)}}async function mgrLogin(){try{let j=await api('login/manager',{method:'POST',body:JSON.stringify({pin:$('#mpin').value})});token=j.token;role='manager';localStorage.token=token;localStorage.role=role;manager()}catch(e){toast(e.message)}}
let etab='home';async function employee(){try{state=await api('me');$('#who').innerHTML=`<button class="btn light" onclick="logout()">Выйти</button>`;renderEmp()}catch{logout()}}function renderEmp(){let e=state.employee;let content={home:`<div class="card hero"><div class="row"><img class="avatar" src="${e.photo||'/assets/logo.png'}"><div><h2>${esc(e.name)}</h2><div>${esc(e.position)}</div></div><div style="margin-left:auto"><div class="score">${e.points}</div><small>баллов</small></div></div></div><div class="grid"><div class="card"><h3>Последние новости</h3>${state.news.slice(0,3).map(newsCard).join('')||'Новостей пока нет'}</div><div class="card"><h3>Мои достижения</h3>${state.achievements.map(a=>`<div class=listitem>${esc(a.icon)} <b>${esc(a.title)}</b><br><small>${esc(a.description)}</small></div>`).join('')||'Пока нет достижений'}</div></div>`,news:`<h2>Новости</h2>${state.news.map(newsCard).join('')||'<div class=card>Новостей пока нет</div>'}`,tasks:`<h2>Задания</h2>${state.tasks.map(x=>`<div class=card><b>${esc(x.title)}</b><p>${esc(x.description)}</p><span class=pill>+${x.points} баллов</span></div>`).join('')}`,prizes:`<h2>Призы</h2>${state.prizes.map(x=>`<div class=card><b>${esc(x.title)}</b><p>${esc(x.description)}</p><span class=pill>${x.cost} баллов</span></div>`).join('')}`,rating:`<h2>Рейтинг команды</h2><div class=card>${state.ranking.map((x,i)=>`<div class="listitem row"><b>${i+1}</b><img class=avatar src="${x.photo||'/assets/logo.png'}"><span>${esc(x.name)}</span><b style="margin-left:auto">${x.points}</b></div>`).join('')}</div>`,profile:`<div class=card><h2>Мой профиль</h2><img class=avatar src="${e.photo||'/assets/logo.png'}"><p><b>${esc(e.name)}</b><br>${esc(e.position)}</p><label>Загрузить фотографию</label><input id=pfile class=field type=file accept="image/*"><button class="btn red" onclick="savePhoto()">Сохранить фото</button><h3>История баллов</h3>${state.history.map(h=>`<div class=listitem><b>${h.delta>0?'+':''}${h.delta}</b> — ${esc(h.reason)} <small>${new Date(h.created_at).toLocaleString('ru')}</small></div>`).join('')}</div>`};$('#app').innerHTML=`<div class=tabs>${[['home','Главная'],['news','Новости'],['tasks','Задания'],['prizes','Призы'],['rating','Рейтинг'],['profile','Профиль']].map(x=>`<button class="${etab==x[0]?'active':''}" onclick="etab='${x[0]}';renderEmp()">${x[1]}</button>`).join('')}</div>${content[etab]}`}
function newsCard(n){return `<div class=listitem>${n.image?`<img class=newsimg src="${n.image}">`:''}<div><span class=pill>${esc(n.category)}</span>${n.pinned?' 📌':''}</div><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p>${n.event_date?`<b>Дата: ${new Date(n.event_date).toLocaleDateString('ru')}</b>`:''}${n.requires_ack&&!n.acknowledged?`<p><button class="btn red" onclick="ack(${n.id})">Ознакомился</button></p>`:n.requires_ack?'<p>✓ Ознакомлено</p>':''}</div>`}async function ack(id){await api('news/ack',{method:'POST',body:JSON.stringify({news_id:id})});await employee()}function savePhoto(){file64($('#pfile'),async p=>{if(!p)return;await api('me/photo',{method:'POST',body:JSON.stringify({photo:p})});toast('Фото сохранено');employee()})}
let mtab='employees';async function manager(){try{state=await api('admin/state');$('#who').innerHTML=`<b>Управляющий</b> <button class="btn light" onclick="logout()">Выйти</button>`;renderMgr()}catch{logout()}}function renderMgr(){let c={employees:empAdmin(),tasks:crudList('Задания',state.tasks,'task'),prizes:crudList('Призы',state.prizes,'prize'),achievements:achAdmin(),news:newsAdmin(),history:`<div class=card><h2>История баллов</h2>${state.history.map(h=>`<div class=listitem><b>${esc(h.employee_name||'')}</b>: ${h.delta>0?'+':''}${h.delta} — ${esc(h.reason)} <small>${new Date(h.created_at).toLocaleString('ru')}</small></div>`).join('')}</div>`,settings:`<div class=card><h2>Настройки</h2><label>Название сезона</label><input id=season class=field value="${esc(state.settings.season)}"><label>Баллов на уровень</label><input id=levelstep class=field type=number value="${state.settings.level_step}"><label>Новый PIN управляющего (необязательно)</label><input id=newmpin class=field type=password><button class="btn red" onclick="saveSettings()">Сохранить</button></div>`};$('#app').innerHTML=`<div class=tabs>${[['employees','Сотрудники'],['tasks','Задания'],['prizes','Призы'],['achievements','Достижения'],['news','Новости'],['history','История'],['settings','Настройки']].map(x=>`<button class="${mtab==x[0]?'active':''}" onclick="mtab='${x[0]}';renderMgr()">${x[1]}</button>`).join('')}</div>${c[mtab]}`}
function empAdmin(){return `<div class=card><h2>Сотрудники</h2><div class=grid3><input id=en class=field placeholder="Имя"><input id=ep class=field placeholder="Должность"><input id=epin class=field placeholder="Индивидуальный PIN"></div><button class="btn red" onclick="addEmp()">Добавить сотрудника</button></div>${state.employees.map(e=>`<div class=card><div class=row><img class=avatar src="${e.photo||'/assets/logo.png'}"><div><b>${esc(e.name)}</b><br><small>${esc(e.position)} · ${e.active?'Активен':'Заблокирован'}</small></div><div class=score style="margin-left:auto">${e.points}</div></div><div class=grid><div><input id="d${e.id}" class=field type=number placeholder="Баллы (+/-)"><input id="r${e.id}" class=field placeholder="Причина"><button class=btn onclick="points(${e.id})">Изменить баллы</button></div><div><input id="p${e.id}" class=field placeholder="Новый PIN"><button class=btn onclick="resetPin(${e.id},'${esc(e.name)}','${esc(e.position)}',${e.active})">Сменить PIN</button> <button class="btn ${e.active?'danger':'ok'}" onclick="toggleEmp(${e.id},'${esc(e.name)}','${esc(e.position)}',${!e.active})">${e.active?'Заблокировать':'Разблокировать'}</button> <button class="btn danger" onclick="del('employees',${e.id})">Удалить</button></div></div></div>`).join('')}`}
async function addEmp(){await api('admin/employees',{method:'POST',body:JSON.stringify({name:$('#en').value,position:$('#ep').value,pin:$('#epin').value})});toast('Сотрудник добавлен');manager()}async function points(id){await api('admin/points',{method:'POST',body:JSON.stringify({employee_id:id,delta:+$('#d'+id).value,reason:$('#r'+id).value})});manager()}async function resetPin(id,name,position,active){let p=$('#p'+id).value;if(!p)return toast('Введите новый PIN');await api('admin/employees',{method:'PUT',body:JSON.stringify({id,name,position,active,pin:p})});toast('PIN изменён')}async function toggleEmp(id,name,position,active){await api('admin/employees',{method:'PUT',body:JSON.stringify({id,name,position,active})});manager()}
function crudList(title,arr,type){let isT=type==='task';return `<div class=card><h2>${title}</h2><input id=ct class=field placeholder="Название"><textarea id=cd class=field placeholder="Описание"></textarea><input id=cv class=field type=number placeholder="${isT?'Баллы':'Стоимость'}"><button class="btn red" onclick="createItem('${type}')">Добавить</button></div>${arr.map(x=>`<div class=card><b>${esc(x.title)}</b><p>${esc(x.description)}</p><span class=pill>${isT?'+'+x.points:x.cost} баллов</span> <button class="btn danger" onclick="del('${isT?'tasks':'prizes'}',${x.id})">Удалить</button></div>`).join('')}`}
async function createItem(t){let b={title:$('#ct').value,description:$('#cd').value,active:true};b[t==='task'?'points':'cost']=+$('#cv').value;await api('admin/'+(t==='task'?'tasks':'prizes'),{method:'POST',body:JSON.stringify(b)});manager()}
function achAdmin(){return `<div class=card><h2>Достижения</h2><input id=ai class=field placeholder="Значок, например ★"><input id=at class=field placeholder="Название"><input id=ad class=field placeholder="Описание"><button class="btn red" onclick="addAch()">Добавить</button></div>${state.achievements.map(a=>`<div class=card>${esc(a.icon)} <b>${esc(a.title)}</b> — ${esc(a.description)}<div class=row><select id="ae${a.id}" class=field style="flex:1">${state.employees.map(e=>`<option value=${e.id}>${esc(e.name)}</option>`).join('')}</select><button class=btn onclick="assignAch(${a.id})">Назначить</button><button class="btn danger" onclick="del('achievements',${a.id})">Удалить</button></div></div>`).join('')}`}
async function addAch(){await api('admin/achievements',{method:'POST',body:JSON.stringify({icon:$('#ai').value,title:$('#at').value,description:$('#ad').value})});manager()}async function assignAch(a){await api('admin/achievement/assign',{method:'POST',body:JSON.stringify({achievement_id:a,employee_id:+$('#ae'+a).value})});toast('Достижение назначено')}
function newsAdmin(){return `<div class=card><h2>Новая публикация</h2><input id=nt class=field placeholder="Заголовок"><select id=nc class=field><option>Важно</option><option>Мероприятие</option><option>Новинка</option><option>Обучение</option><option>Для команды</option></select><textarea id=nb class=field placeholder="Текст новости"></textarea><label>Дата мероприятия (необязательно)</label><input id=nd class=field type=date><label>Фото</label><input id=nimg class=field type=file accept="image/*"><div class=row><label><input id=np type=checkbox> Закрепить</label><label><input id=na type=checkbox> Требовать «Ознакомился»</label></div><br><button class="btn red" onclick="addNews()">Опубликовать</button></div>${state.news.map(n=>`<div class=card>${n.image?`<img class=newsimg src="${n.image}">`:''}<span class=pill>${esc(n.category)}</span><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><small>Ознакомились: ${n.read_count}</small><br><button class="btn danger" onclick="del('news',${n.id})">Удалить</button></div>`).join('')}`}
function addNews(){file64($('#nimg'),async p=>{await api('admin/news',{method:'POST',body:JSON.stringify({title:$('#nt').value,category:$('#nc').value,body:$('#nb').value,event_date:$('#nd').value||null,image:p,pinned:$('#np').checked,requires_ack:$('#na').checked,active:true})});toast('Новость опубликована');manager()})}
async function del(kind,id){if(!confirm('Удалить?'))return;await api('admin/'+kind,{method:'DELETE',body:JSON.stringify({id})});manager()}async function saveSettings(){await api('admin/settings',{method:'POST',body:JSON.stringify({season:$('#season').value,level_step:+$('#levelstep').value,manager_pin:$('#newmpin').value||null})});toast('Настройки сохранены');manager()}
(async()=>{if(token&&role==='employee')employee();else if(token&&role==='manager')manager();else login()})();
</script></body></html>
