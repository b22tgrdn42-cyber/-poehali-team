<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b7161b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/manifest.webmanifest"><title>Команда, поехали!</title><style>
:root{
  --red:#b7161b;
  --red-2:#d12228;
  --sand:#e8b35b;
  --sand-2:#f5d495;
  --cream:#fff8eb;
  --paper:#fffdf8;
  --ink:#121212;
  --ink-2:#232323;
  --muted:#7b6c5d;
  --line:#ead9bd;
  --green:#1f7a4d;
  --shadow:0 20px 60px rgba(69,40,8,.12);
  --shadow-soft:0 10px 30px rgba(69,40,8,.08);
  --radius-xl:28px;
  --radius-lg:22px;
  --radius-md:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 12% 8%, rgba(232,179,91,.34), transparent 30%),
    radial-gradient(circle at 90% 0%, rgba(183,22,27,.13), transparent 28%),
    linear-gradient(180deg,#fffaf1 0%,#f7ead3 48%,#f1ddbb 100%);
  -webkit-font-smoothing:antialiased;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.3),transparent 70%);
}
button,input,select,textarea{font:inherit}
button{border:0}
a{color:inherit}
.top{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:16px;
  padding:14px max(18px,4vw);
  background:rgba(255,250,241,.78);
  border-bottom:1px solid rgba(234,217,189,.9);
  backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 8px 30px rgba(73,47,14,.06);
}
.logo{
  width:72px;height:72px;object-fit:contain;
  filter:drop-shadow(0 8px 18px rgba(125,63,12,.16));
}
.brand{min-width:0}
.brand b{
  display:block;
  font-size:22px;
  line-height:1;
  letter-spacing:.01em;
  font-weight:900;
}
.brand small{
  display:block;
  margin-top:6px;
  color:var(--muted);
  font-size:13px;
}
.wrap{
  max-width:1280px;
  margin:0 auto;
  padding:28px 24px 80px;
}
.login{
  max-width:560px;
  margin:5vh auto 0;
  text-align:left;
}
.loginlogo{
  width:220px;
  display:block;
  margin:0 auto 16px;
  filter:drop-shadow(0 16px 35px rgba(135,70,10,.16));
}
.card{
  position:relative;
  background:linear-gradient(180deg,rgba(255,253,248,.97),rgba(255,249,238,.95));
  border:1px solid rgba(231,208,169,.85);
  border-radius:var(--radius-lg);
  padding:22px;
  box-shadow:var(--shadow-soft);
  margin-bottom:16px;
  overflow:hidden;
}
.card:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(145deg,rgba(255,255,255,.52),transparent 32%);
}
.card>*{position:relative}
.hero{
  background:
    radial-gradient(circle at 82% 15%,rgba(255,255,255,.52),transparent 20%),
    linear-gradient(135deg,var(--sand) 0%,#efc776 58%,#f8dfaa 100%);
  border:1px solid rgba(170,105,15,.12);
  box-shadow:0 24px 60px rgba(136,79,9,.14);
}
.hero h2{margin-top:0;font-size:clamp(28px,4vw,46px);letter-spacing:-.03em}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:6px 0 20px;
  padding:6px;
  border-radius:18px;
  background:rgba(255,253,248,.66);
  border:1px solid rgba(231,208,169,.8);
  box-shadow:0 8px 30px rgba(79,48,8,.05);
  backdrop-filter:blur(14px);
}
.tabs button{
  border-radius:13px;
  padding:11px 14px;
  color:#4a3a2e;
  background:transparent;
  cursor:pointer;
  font-weight:800;
  transition:.22s ease;
}
.tabs button:hover{background:#fff7e8;transform:translateY(-1px)}
.tabs button.active{
  color:#fff;
  background:linear-gradient(135deg,var(--red),var(--red-2));
  box-shadow:0 10px 24px rgba(183,22,27,.24);
}
.btn{
  appearance:none;
  border-radius:13px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:850;
  color:#fff;
  background:linear-gradient(135deg,var(--ink),#303030);
  box-shadow:0 8px 18px rgba(0,0,0,.12);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,0,0,.16)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.red{background:linear-gradient(135deg,var(--red),var(--red-2));box-shadow:0 10px 24px rgba(183,22,27,.24)}
.btn.light{background:#fff9ef;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger,.danger{background:linear-gradient(135deg,#7f1d1d,#991b1b)}
.btn.ok,.ok{background:linear-gradient(135deg,#1f7a4d,#2a9560)}
.field{
  width:100%;
  padding:13px 14px;
  border:1px solid #dcc8a5;
  border-radius:13px;
  background:rgba(255,255,255,.92);
  color:var(--ink);
  outline:none;
  margin:6px 0 12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
  transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.field:focus{
  border-color:#c88b32;
  box-shadow:0 0 0 4px rgba(232,179,91,.18);
  transform:translateY(-1px);
}
textarea.field{min-height:110px;resize:vertical}
.avatar{
  width:64px;height:64px;
  border-radius:20px;
  object-fit:cover;
  background:linear-gradient(135deg,#f3d8a6,#fff);
  border:2px solid rgba(255,255,255,.85);
  box-shadow:0 10px 24px rgba(80,48,10,.12);
}
.newsimg{
  width:100%;
  max-height:360px;
  object-fit:cover;
  border-radius:18px;
  margin-bottom:14px;
  box-shadow:0 14px 30px rgba(55,33,7,.12);
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(18,18,18,.92);
  color:#fff;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}
.muted{color:var(--muted)}
.score{
  font-size:38px;
  line-height:1;
  font-weight:950;
  letter-spacing:-.04em;
  color:var(--red);
}
.listitem{
  padding:14px 0;
  border-bottom:1px solid rgba(232,213,181,.9);
}
.listitem:last-child{border-bottom:0}
.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:10000;
  max-width:min(420px,calc(100vw - 36px));
  padding:13px 16px;
  border-radius:14px;
  color:#fff;
  background:rgba(18,18,18,.95);
  box-shadow:0 18px 50px rgba(0,0,0,.22);
  backdrop-filter:blur(10px);
}
.supervisor-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:850;
  color:#fff;
  background:linear-gradient(135deg,#222,#3a3a3a);
}
.home-tasks{
  background:
    radial-gradient(circle at 90% 10%,rgba(183,22,27,.12),transparent 22%),
    linear-gradient(135deg,#fffaf0,#ffe8b6);
  border:1px solid rgba(183,22,27,.16);
}
.home-task{
  background:rgba(255,255,255,.84);
  border:1px solid rgba(225,199,157,.75);
  border-radius:16px;
  padding:15px;
  margin-top:10px;
  box-shadow:0 8px 18px rgba(72,40,5,.06);
}
.notify-card{
  background:
    radial-gradient(circle at 80% 20%,rgba(232,179,91,.24),transparent 28%),
    linear-gradient(135deg,#171717,#2a2a2a);
  color:#fff;
  border:0;
}
.notify-card .muted{color:#d8cbb9}
.notify-card .btn{background:linear-gradient(135deg,var(--sand),#f4cf88);color:#171717;box-shadow:none}
.task-personal{
  border-left:4px solid var(--red);
  padding-left:16px;
  position:relative;
}
.task-personal:after{
  content:"ЛИЧНОЕ";
  position:absolute;
  right:0;top:0;
  padding:5px 9px;
  font-size:10px;
  font-weight:900;
  color:#fff;
  background:var(--red);
  border-radius:0 12px 0 12px;
}
.hidden{display:none!important}

/* Premium transitions */
#app{position:relative;transform-origin:50% 20%}
#app.page-enter{animation:pageEnter .34s cubic-bezier(.22,1,.36,1) both}
@keyframes pageEnter{
  0%{opacity:.35;transform:translateY(7px) scale(.997)}
  100%{opacity:1;transform:none}
}
.card{animation:cardEnter .38s cubic-bezier(.22,1,.36,1) both}
.card:nth-of-type(2){animation-delay:.02s}
.card:nth-of-type(3){animation-delay:.04s}
.card:nth-of-type(4){animation-delay:.06s}
@keyframes cardEnter{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.nav-flare{position:fixed;inset:0;z-index:9000;pointer-events:none;overflow:hidden}
.nav-flare:before{
  content:"";
  position:absolute;top:0;bottom:0;left:-35%;
  width:28%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),rgba(232,179,91,.25),transparent);
  filter:blur(6px);
  transform:skewX(-18deg);
  animation:sweep .48s ease-out forwards;
}
@keyframes sweep{to{left:120%;opacity:0}}
.fireworks-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--spark,#fff);box-shadow:0 0 14px var(--spark,#fff);animation:sparkFly 900ms ease-out forwards}
@keyframes sparkFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}
.confetti{position:absolute;width:8px;height:14px;border-radius:2px;background:var(--c,#fff);animation:confettiFall 1200ms cubic-bezier(.2,.7,.2,1) forwards}
@keyframes confettiFall{0%{transform:translate(0,-10px) rotate(0);opacity:1}100%{transform:translate(var(--x),110vh) rotate(720deg);opacity:0}}
.points-pop{
  position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);
  z-index:10000;
  padding:14px 22px;
  border-radius:999px;
  color:#fff;
  background:linear-gradient(135deg,#171717,#2a2a2a);
  border:2px solid var(--sand);
  font-weight:950;
  font-size:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
  animation:pointsPop 1.2s ease forwards;
}
@keyframes pointsPop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1;transform:translate(-50%,-58%) scale(1)}100%{opacity:0;transform:translate(-50%,-85%) scale(.92)}}
@media(max-width:760px){
  .top{padding:10px 12px}
  .logo{width:54px;height:54px}
  .brand b{font-size:17px}
  .brand small{display:none}
  .wrap{padding:14px 12px 88px}
  .grid,.grid3{grid-template-columns:1fr}
  .card{padding:17px;border-radius:18px}
  .tabs{
    position:sticky;
    top:76px;
    z-index:30;
    flex-wrap:nowrap;
    overflow-x:auto;
    margin:0 -4px 14px;
    padding:5px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap;flex:0 0 auto}
  .score{font-size:32px}
  .avatar{width:58px;height:58px;border-radius:18px}
  .hero h2{font-size:32px}
}
@media(max-width:420px){
  .brand b{font-size:15px}
  .logo{width:48px;height:48px}
  .top .btn.light{padding:9px 10px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
    scroll-behavior:auto!important
  }
}

/* Modern authentication screen */
.auth-shell{
  max-width:980px;
  margin:3vh auto 0;
  display:grid;
  grid-template-columns:minmax(0,.9fr) minmax(380px,1.1fr);
  gap:18px;
  align-items:stretch;
}
.auth-brand{
  min-height:580px;
  padding:34px;
  border-radius:30px;
  color:#fff;
  background:
    radial-gradient(circle at 75% 14%,rgba(255,255,255,.2),transparent 25%),
    radial-gradient(circle at 10% 90%,rgba(232,179,91,.25),transparent 28%),
    linear-gradient(145deg,#171717 0%,#2b2118 60%,#5c2c20 100%);
  box-shadow:0 28px 80px rgba(48,28,4,.18);
  position:relative;
  overflow:hidden;
}
.auth-brand:before{
  content:"";
  position:absolute;
  width:390px;height:390px;
  border-radius:50%;
  background:rgba(183,22,27,.92);
  right:-175px;top:54%;
  transform:translateY(-50%);
  box-shadow:0 0 0 22px rgba(255,255,255,.06),0 0 0 58px rgba(232,179,91,.10);
  z-index:0;
}
.auth-brand>*{position:relative;z-index:2}
.auth-brand:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(90deg,rgba(23,23,23,.12) 0%,rgba(23,23,23,.04) 55%,transparent 100%);
  z-index:1;
}
.auth-logo{
  width:210px;
  max-width:72%;
  filter:drop-shadow(0 18px 36px rgba(0,0,0,.22));
}
.auth-kicker{
  margin-top:36px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#f1c97f;
}
.auth-title{
  max-width:480px;
  margin:10px 0 12px;
  font-size:clamp(38px,5vw,64px);
  line-height:.96;
  letter-spacing:-.05em;
}
.auth-copy{
  max-width:430px;
  font-size:16px;
  line-height:1.55;
  color:#eee4d5;
}
.auth-points{
  display:flex;gap:10px;flex-wrap:wrap;
  margin-top:26px;
}
.auth-points span{
  padding:8px 11px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:999px;
  background:rgba(255,255,255,.06);
  font-size:12px;font-weight:800;
}
.auth-panel{
  padding:28px;
  border-radius:30px;
  background:rgba(255,253,248,.88);
  border:1px solid rgba(231,208,169,.9);
  box-shadow:0 28px 80px rgba(69,40,8,.12);
  backdrop-filter:blur(20px) saturate(140%);
}
.auth-panel h2{font-size:30px;letter-spacing:-.03em;margin:4px 0 6px}
.auth-panel .lead{margin:0 0 20px;color:var(--muted)}
.auth-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  padding:5px;
  border-radius:15px;
  background:#f3e6cf;
  margin-bottom:18px;
}
.auth-switch button{
  padding:10px;
  border-radius:11px;
  background:transparent;
  color:#6a5847;
  font-weight:900;
  cursor:pointer;
  transition:.2s ease;
}
.auth-switch button.active{
  background:#fff;
  color:var(--ink);
  box-shadow:0 8px 18px rgba(69,40,8,.08);
}
.employee-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
  max-height:270px;
  overflow:auto;
  padding:2px;
  margin-bottom:14px;
}
.employee-choice{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:66px;
  text-align:left;
  padding:10px;
  border-radius:14px;
  border:1px solid #e4d0ac;
  background:#fffaf0;
  color:var(--ink);
  cursor:pointer;
  transition:.18s ease;
}
.employee-choice:hover{transform:translateY(-1px);border-color:#cf9e50;box-shadow:0 8px 20px rgba(69,40,8,.07)}
.employee-choice.selected{border-color:var(--red);box-shadow:0 0 0 3px rgba(183,22,27,.1)}
.employee-choice img{width:44px;height:44px;border-radius:14px;object-fit:cover;background:#f5dfb7}
.employee-choice b{display:block;font-size:14px}
.employee-choice small{display:block;color:var(--muted);margin-top:2px;font-size:11px}
.pin-wrap{position:relative}
.pin-wrap .field{padding-right:52px;font-size:20px;letter-spacing:.22em;font-weight:900}
.pin-eye{
  position:absolute;right:8px;top:11px;
  width:38px;height:38px;border-radius:10px;
  background:#f2e4ca;color:#5b4634;cursor:pointer;font-size:17px;
}
.auth-submit{width:100%;padding:14px 16px;font-size:15px}
.auth-note{margin-top:12px;text-align:center;color:var(--muted);font-size:12px}
.manager-form{display:none}
.manager-form.active{display:block}
.employee-form.hidden-auth{display:none}
@media(max-width:850px){
  .auth-shell{grid-template-columns:1fr;max-width:620px;margin-top:1vh}
  .auth-brand{min-height:300px;padding:24px}
  .auth-title{font-size:44px}
  .auth-brand:after{width:220px;height:220px;right:-120px;bottom:-120px}
}
@media(max-width:520px){
  .auth-shell{gap:10px}
  .auth-brand{min-height:240px;border-radius:22px}
  .auth-logo{width:140px}
  .auth-kicker{margin-top:18px}
  .auth-title{font-size:36px}
  .auth-copy{font-size:14px}
  .auth-panel{padding:18px;border-radius:22px}
  .employee-grid{grid-template-columns:1fr;max-height:235px}
}

/* Messenger */
.chat-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;min-height:650px}
.chat-sidebar,.chat-main{background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-soft);overflow:hidden}
.chat-sidebar{display:flex;flex-direction:column}
.chat-tools{padding:14px;border-bottom:1px solid var(--line)}
.chat-list{overflow:auto;max-height:590px}
.chat-row{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid #efe1ca;cursor:pointer;transition:.16s ease}
.chat-row:hover,.chat-row.active{background:#fff0d7}
.chat-row .avatar{width:46px;height:46px;border-radius:15px;flex:0 0 auto}
.chat-row-main{min-width:0;flex:1}
.chat-row-main b,.chat-preview{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-preview{font-size:12px;color:var(--muted);margin-top:3px}
.unread{min-width:23px;height:23px;padding:0 7px;border-radius:999px;background:var(--red);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.chat-main{display:flex;flex-direction:column;min-width:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);background:rgba(255,250,240,.8)}
.chat-head .avatar{width:44px;height:44px;border-radius:14px}
.chat-messages{flex:1;min-height:470px;max-height:570px;overflow:auto;padding:18px;background:linear-gradient(180deg,#fffaf0,#f8ead2)}
.msg{display:flex;gap:8px;margin:8px 0;max-width:78%}
.msg.mine{margin-left:auto;flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:11px;object-fit:cover}
.bubble{padding:10px 12px;border-radius:16px 16px 16px 5px;background:#fff;box-shadow:0 5px 14px #5b341012;min-width:80px}
.msg.mine .bubble{background:linear-gradient(135deg,#f6cf86,#efb960);border-radius:16px 16px 5px 16px}
.msg-meta{font-size:10px;color:#81715f;margin-top:5px;text-align:right}
.msg-name{font-size:11px;font-weight:900;color:var(--red);margin-bottom:4px}
.msg-img{max-width:280px;width:100%;border-radius:12px;display:block;margin-bottom:7px}
.reply-box{border-left:3px solid var(--red);padding:5px 8px;margin-bottom:6px;background:#00000008;border-radius:6px;font-size:11px}
.reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.react{padding:3px 7px;border-radius:999px;background:#ffffffb0;border:1px solid #e7d1ad;font-size:11px;cursor:pointer}
.chat-compose{padding:12px;border-top:1px solid var(--line);background:#fffdf8}
.compose-row{display:flex;gap:8px;align-items:flex-end}
.compose-row textarea{margin:0;min-height:44px;max-height:120px}
.compose-action{width:44px;height:44px;border-radius:13px;flex:0 0 auto}
.typing{font-size:11px;color:var(--muted);padding:0 16px 7px;min-height:18px}
.reply-active{padding:7px 10px;margin-bottom:7px;background:#fff0d6;border-radius:10px;font-size:11px}

async function welcomeEnableNotifications(){
 const st=$('#welcomeStatus');
 try{
   if(localStorage.getItem('pushOnboardingDone')!=='1'){
     if(!('Notification' in window)||!('serviceWorker' in navigator)||!('PushManager' in window)){
       if(st)st.textContent='Этот браузер не поддерживает push. Откройте сайт в совместимом браузере или добавьте его на главный экран.';
       return;
     }
     const permission=await Notification.requestPermission();
     if(permission!=='granted'){
       if(st)st.textContent='Уведомления не разрешены. Разрешите их в настройках устройства, затем нажмите кнопку снова.';
       return;
     }
     const key=await api('push/key');
     if(!key.publicKey){if(st)st.textContent='Push-сервис временно не настроен на сервере.';return}
     await navigator.serviceWorker.register('/sw.js');
     const reg=await navigator.serviceWorker.ready;
     let sub=await reg.pushManager.getSubscription();
     if(sub){
       const current=uint8ToB64Url(sub.options?.applicationServerKey);
       if(current&&current!==key.publicKey){try{await sub.unsubscribe()}catch{};sub=null}
     }
     if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToUint8Array(key.publicKey)});
     await api('push/subscribe',{method:'POST',body:JSON.stringify({subscription:sub.toJSON()})});
     localStorage.setItem('pushOnboardingDone','1');
   }
   localStorage.setItem('welcomeSeen','1');
   const layer=$('#welcomeStage');if(layer){layer.classList.add('welcome-out');setTimeout(()=>layer.remove(),520)}
   setTimeout(()=>{if(role==='supervisor')supervisor();else employee()},420);
 }catch(e){if(st)st.textContent='Не удалось включить уведомления: '+e.message}
}

function stopMessengerPolling(){if(messengerTimer){clearInterval(messengerTimer);messengerTimer=null}}
function isOnline(ts){return ts&&(Date.now()-new Date(ts).getTime()<120000)}
async function loadMessenger(){
  try{
    messengerState=await api('messenger/state');
    renderMessenger();
    stopMessengerPolling();
    messengerTimer=setInterval(async()=>{
      if(etab!=='messenger')return stopMessengerPolling();
      try{messengerState=await api('messenger/state');renderChatList();if(currentChatId)await refreshMessages(false)}catch{}
    },3500);
    const q=new URLSearchParams(location.search),cid=Number(q.get('chat'));
    if(cid){currentChatId=cid;await openChat(cid)}
  }catch(e){$('#messengerRoot').innerHTML=`<div class=card>${esc(e.message)}</div>`}
}

async function refreshMessages(scrollBottom=true){

 const me=state.employee.id;

   const mine=m.sender_id===me;
   if(m.deleted)return `<div class="msg ${mine?'mine':''}"><div class=bubble><i class=muted>Сообщение удалено</i></div></div>`;
   return `<div class="msg ${mine?'mine':''}">
    <img class=msg-avatar src="${m.sender_photo||'/assets/logo.png'}">
    <div class=bubble>
      ${!mine?`<div class=msg-name>${esc(m.sender_name||'')}</div>`:''}
      ${m.reply_to?`<div class=reply-box><b>${esc(m.reply_sender||'')}</b><br>${esc((m.reply_body||'').slice(0,90))}</div>`:''}
      ${m.image?`<img class=msg-img src="${m.image}">`:''}
      <div>${esc(m.body).replace(/\n/g,'<br>')}</div>
      <div class=reactions>${(m.reactions||[]).map(x=>`<button class=react onclick="reactMsg(${m.id},'${x.reaction}')">${x.reaction} ${x.count}</button>`).join('')}</div>
      <div class=msg-actions><button onclick="setReply(${m.id},'${esc((m.body||'').replace(/'/g,'&#39;').slice(0,80))}')">↩ Ответить</button><button onclick="reactMsg(${m.id},'👍')">👍</button><button onclick="reactMsg(${m.id},'❤️')">❤️</button><button onclick="reactMsg(${m.id},'🔥')">🔥</button>${mine?`<button onclick="editMsg(${m.id},'${esc((m.body||'').replace(/'/g,'&#39;'))}')">Изм.</button><button onclick="deleteMsg(${m.id})">Удалить</button>`:''}</div>
      <div class=msg-meta>${m.edited_at?'изменено · ':''}${new Date(m.created_at).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>
   </div>`
 }).join('');
 const t=$('#typingLine');if(t)t.textContent=r.typers.length?r.typers.map(x=>x.name).join(', ')+' печатает…':'';
 if(scrollBottom)box.scrollTop=box.scrollHeight

async function sendMessage(){

   await api('messenger/messages',{method:'POST',body:JSON.stringify({chat_id:currentChatId,body:txt,image,reply_to:replyToMessage})});

let mtab='employees';async function manager(){try{state=await api('admin/state');$('#who').innerHTML=`<b>${esc(T('admin.role_label','Управляющий'))}</b> <button class="btn light" onclick="logout()">Выйти</button>`;renderMgr()}catch{logout()}}function renderMgr(){let c={employees:`<div data-ui-block="admin.employees">${empAdmin()}</div>`,tasks:`<div data-ui-block="admin.tasks">${crudList('Задания',state.tasks,'task')}</div>`,prizes:`<div data-ui-block="admin.prizes">${crudList('Призы',state.prizes,'prize')}</div>`,achievements:`<div data-ui-block="admin.achievements">${achAdmin()}</div>`,news:`<div data-ui-block="admin.news">${newsAdmin()}</div>`,competition:`<div data-ui-block="admin.competition">${competitionAdmin()}</div>`,individual:`<div data-ui-block="admin.individual">${individualAdmin()}</div>`,messengerAdmin:`<div data-ui-block="admin.messenger">${messengerAdmin()}</div>`,interface:interfaceAdmin(),history:`<div data-ui-block="admin.history"><div class=card><h2>${esc(T('profile.points_history','История баллов'))}</h2>${state.history.map(h=>`<div class=listitem><b>${esc(h.employee_name||'')}</b>: ${h.delta>0?'+':''}${h.delta} — ${esc(h.reason)} <small>${new Date(h.created_at).toLocaleString('ru')}</small></div>`).join('')}</div></div>`,settings:`<div class=card data-ui-block="admin.settings"><h2>Настройки</h2><label>Название сезона</label><input id=season class=field value="${esc(state.settings.season)}"><label>Баллов на уровень</label><input id=levelstep class=field type=number value="${state.settings.level_step}"><label>Новый PIN управляющего (необязательно)</label><input id=newmpin class=field type=password><button class="btn red" onclick="saveSettings()">Сохранить</button></div>`};$('#app').innerHTML=`<div class=tabs>${[['employees',T('admin.tab.employees','Сотрудники')],['tasks',T('admin.tab.tasks','Задания')],['prizes',T('admin.tab.prizes','Призы')],['achievements',T('admin.tab.achievements','Достижения')],['news',T('admin.tab.news','Новости')],['competition',T('admin.tab.competition','Конкурс')],['individual',T('admin.tab.individual','Индивидуальные задания')],['messengerAdmin',T('admin.tab.messenger','Мессенджер')],['history',T('admin.tab.history','История')],['interface',T('admin.tab.interface','Редактор интерфейса')],['settings',T('admin.tab.settings','Настройки')]].map(x=>`<button class="${mtab==x[0]?'active':''}" onclick="mtab='${x[0]}';renderMgr()">${x[1]}</button>`).join('')}</div>${c[mtab]}`;animateSection();restoreTabsScroll('manager');applyBlockVisibility(document);applyRemovedElements(document);if(mtab==='interface')setTimeout(()=>{renderReplacementList();renderRemovedElements()},30);if(mtab==='messengerAdmin')setTimeout(()=>loadMessengerAdmin(),30)}
function empAdmin(){return `<div class=card><h2 style="margin-bottom:6px">Сотрудники и управляющий персонал</h2><p class="muted" style="margin-top:0">Роли, доступы, участие в рейтинге и персональные PIN-коды.</p><div class=grid3><input id=en class=field placeholder="Имя"><select id=ep class=field><option>Официант</option><option>Бармен</option><option>Администратор</option><option>Старший смены</option><option>Управляющий</option><option>Стажёр</option><option>Другое</option></select><input id=epin class=field placeholder="Индивидуальный PIN"></div><div class=grid><label>Уровень доступа<select id=ear class=field><option value="employee">Сотрудник</option><option value="supervisor">Наблюдатель / руководитель</option></select></label><label style="padding-top:14px"><input id=etm type=checkbox checked> Показывать как участника команды (рейтинг, конкурс)</label><label style="padding-top:14px"><input id=ema type=checkbox> Доступ к внутреннему мессенджеру</label></div><button class="btn red" onclick="addEmp()">Добавить</button></div>${state.employees.map(e=>`<div class=card><div class=row><img class=avatar src="${e.photo||'/assets/logo.png'}"><div><b>${esc(e.name)}</b><br><small>${esc(e.position)} · ${e.active?'Активен':'Заблокирован'} · ${e.team_member?'Участник команды':'Не участвует в рейтинге'}</small><br>${e.access_role==='supervisor'?'<span class=supervisor-badge>Доступ наблюдателя</span>':''}</div><div class=score style="margin-left:auto">${e.points}</div></div><div class=grid><div><input id="d${e.id}" class=field type=number placeholder="Баллы (+/-)"><input id="r${e.id}" class=field placeholder="Причина"><button class=btn onclick="points(${e.id})">Изменить баллы</button></div><div><input id="p${e.id}" class=field placeholder="Новый PIN"><select id="ar${e.id}" class=field><option value="employee" ${e.access_role!=='supervisor'?'selected':''}>Сотрудник</option><option value="supervisor" ${e.access_role==='supervisor'?'selected':''}>Наблюдатель / руководитель</option></select><label><input id="tm${e.id}" type=checkbox ${e.team_member?'checked':''}> Участник команды</label><br><label><input id="ma${e.id}" type=checkbox ${e.messenger_access?'checked':''}> Доступ к мессенджеру</label><br><button class=btn onclick="saveEmpMeta(${e.id},'${esc(e.name)}','${esc(e.position)}',${e.active})">Сохранить роль</button> <button class=btn onclick="resetPin(${e.id},'${esc(e.name)}','${esc(e.position)}',${e.active},'${e.access_role}',${e.team_member})">Сменить PIN</button> <button class="btn ${e.active?'danger':'ok'}" onclick="toggleEmp(${e.id},'${esc(e.name)}','${esc(e.position)}',${!e.active},'${e.access_role}',${e.team_member})">${e.active?'Заблокировать':'Разблокировать'}</button> <button class="btn danger" onclick="del('employees',${e.id})">Удалить</button></div></div></div>`).join('')}`}
async function addEmp(){await api('admin/employees',{method:'POST',body:JSON.stringify({name:$('#en').value,position:$('#ep').value,pin:$('#epin').value,access_role:$('#ear').value,team_member:$('#etm').checked,messenger_access:$('#ema').checked})});toast('Сотрудник добавлен');manager()}
async function points(id){let delta=+$('#d'+id).value;await api('admin/points',{method:'POST',body:JSON.stringify({employee_id:id,delta,reason:$('#r'+id).value})});pointCelebration(delta);manager()}
async function saveEmpMeta(id,name,position,active){await api('admin/employees',{method:'PUT',body:JSON.stringify({id,name,position,active,access_role:$('#ar'+id).value,team_member:$('#tm'+id).checked,messenger_access:$('#ma'+id).checked})});toast('Настройки сотрудника сохранены');manager()}
async function resetPin(id,name,position,active,access_role,team_member,messenger_access){let p=$('#p'+id).value;if(!p)return toast('Введите новый PIN');await api('admin/employees',{method:'PUT',body:JSON.stringify({id,name,position,active,pin:p,access_role,team_member,messenger_access})});toast('PIN изменён')}
async function toggleEmp(id,name,position,active,access_role,team_member,messenger_access){await api('admin/employees',{method:'PUT',body:JSON.stringify({id,name,position,active,access_role,team_member,messenger_access})});manager()}
function crudList(title,arr,type){let isT=type==='task';return `<div class=card><h2>${title}</h2><input id=ct class=field placeholder="Название"><textarea id=cd class=field placeholder="Описание"></textarea><input id=cv class=field type=number placeholder="${isT?'Баллы':'Стоимость'}"><button class="btn red" onclick="createItem('${type}')">Добавить</button></div>${arr.map(x=>`<div class=card><b>${esc(x.title)}</b><p>${esc(x.description)}</p><span class=pill>${isT?'+'+x.points:x.cost} баллов</span> <button class="btn danger" onclick="del('${isT?'tasks':'prizes'}',${x.id})">Удалить</button></div>`).join('')}`}
async function createItem(t){let b={title:$('#ct').value,description:$('#cd').value,active:true};b[t==='task'?'points':'cost']=+$('#cv').value;let r=await api('admin/'+(t==='task'?'tasks':'prizes'),{method:'POST',body:JSON.stringify(b)});if(t==='task'&&r.push)toast(r.push.sent>0?`Задание создано · уведомлений отправлено: ${r.push.sent}`:'Задание создано · подписанных устройств пока нет');manager()}
function achAdmin(){return `<div class=card><h2>Достижения</h2><input id=ai class=field placeholder="Значок, например ★"><input id=at class=field placeholder="Название"><input id=ad class=field placeholder="Описание"><button class="btn red" onclick="addAch()">Добавить</button></div>${state.achievements.map(a=>`<div class=card>${esc(a.icon)} <b>${esc(a.title)}</b> — ${esc(a.description)}<div class=row><select id="ae${a.id}" class=field style="flex:1">${state.employees.map(e=>`<option value=${e.id}>${esc(e.name)}</option>`).join('')}</select><button class=btn onclick="assignAch(${a.id})">Назначить</button><button class="btn danger" onclick="del('achievements',${a.id})">Удалить</button></div></div>`).join('')}`}
async function addAch(){await api('admin/achievements',{method:'POST',body:JSON.stringify({icon:$('#ai').value,title:$('#at').value,description:$('#ad').value})});manager()}async function assignAch(a){await api('admin/achievement/assign',{method:'POST',body:JSON.stringify({achievement_id:a,employee_id:+$('#ae'+a).value})});toast('Достижение назначено')}

   <div id=uiFieldsWrap class=ui-editor-grid>${UI_FIELDS.map(([section,key,label,def])=>{
     const head=section!==last?(last=section,`<h3 class="ui-section-title ui-section-node" data-search="${esc((section+' '+key+' '+label).toLowerCase())}">${esc(section)}</h3>`):'';
     return head+`<div class="ui-edit-card ui-field-node" data-search="${esc((section+' '+key+' '+label+' '+def).toLowerCase())}"><label>${esc(label)} · <code>${esc(key)}</code></label><textarea id="ui_${key.replace(/\./g,'_')}" class=field>${esc(T(key,def))}</textarea><div class=row><button class="btn red" onclick="saveUiField('${key}','ui_${key.replace(/\./g,'_')}')">Сохранить</button><button class="btn light" onclick="resetUiField('${key}')">Вернуть стандарт</button></div></div>`
   }).join('')}</div>
   <div style="margin-top:16px"><button class="btn red" onclick="saveAllUi()">Сохранить все изменения</button></div>
 </div>`
}

async function toggleUiBlock(key,hidden){
 await api('admin/content/blocks',{method:'POST',body:JSON.stringify({block_key:key,hidden})});
 uiBlocks[key]=hidden;
 toast(hidden?'Окно скрыто':'Окно возвращено');
 manager()
}
async function resetAllBlocks(){
 for(const [,key] of UI_BLOCKS){
   await api('admin/content/blocks',{method:'POST',body:JSON.stringify({block_key:key,hidden:false})});
   uiBlocks[key]=false;
 }
 toast('Все окна снова отображаются');manager()
}

function renderRemovedElements(){
 const box=$('#removedElementsList');if(!box)return;
 box.innerHTML=(uiRemovedElements||[]).length?uiRemovedElements.map(r=>`<div class=removed-rule><span class=pill>${r.element_type==='button'?'Кнопка':'Окно'}</span><code>${esc(r.match_text)}</code><button class="btn ok" onclick="restoreRemovedElement(${r.id})">Вернуть</button></div>`).join(''):'<p class=muted>Точечных удалений пока нет.</p>'
}
async function addRemovedElement(){
 const element_type=$('#removeType').value,match_text=$('#removeText').value.trim();
 if(!match_text)return toast('Введите точный текст элемента');
 const r=await api('admin/content/removed-elements',{method:'POST',body:JSON.stringify({element_type,match_text})});
 uiRemovedElements.push({id:r.id,element_type,match_text});
 $('#removeText').value='';renderRemovedElements();applyRemovedElements(document);toast('Элемент удалён из интерфейса')
}
async function restoreRemovedElement(id){
 await api('admin/content/removed-elements',{method:'DELETE',body:JSON.stringify({id})});
 uiRemovedElements=uiRemovedElements.filter(x=>x.id!==id);
 toast('Элемент возвращён');manager()
}
function filterUiFields(){
 const q=($('#uiFieldSearch')?.value||'').toLowerCase().trim();
 document.querySelectorAll('.ui-field-node').forEach(n=>n.style.display=!q||n.dataset.search.includes(q)?'':'none');
 document.querySelectorAll('.ui-section-node').forEach(n=>n.style.display=!q||n.dataset.search.includes(q)?'':'');
}
function renderReplacementList(){
 const box=$('#replacementList');if(!box)return;
 const q=($('#repSearch')?.value||'').toLowerCase();
 const rows=(uiReplacements||[]).filter(x=>(x.source_text+' '+x.replacement_text).toLowerCase().includes(q));
 box.innerHTML=rows.length?rows.map(x=>`<div class=fulltext-row><div><small>Исходный текст</small><code>${esc(x.source_text)}</code></div><div><small>Новый текст</small><code>${esc(x.replacement_text)}</code></div><button class="btn danger" onclick='deleteReplacement(${JSON.stringify(x.source_text)})'>Удалить</button></div>`).join(''):'<p class=muted>Глобальных замен пока нет.</p>'
}
async function saveReplacement(){
 const source=$('#repSource').value.trim(),value=$('#repValue').value;
 if(!source)return toast('Введите исходный текст');
 await api('admin/content/replacements',{method:'POST',body:JSON.stringify({source_text:source,replacement_text:value})});
 const i=uiReplacements.findIndex(x=>x.source_text===source);
 if(i>=0)uiReplacements[i].replacement_text=value;else uiReplacements.push({source_text:source,replacement_text:value});
 $('#repSource').value='';$('#repValue').value='';
 renderReplacementList();applyGlobalTextReplacements(document.body);toast('Глобальная замена сохранена')
}
async function deleteReplacement(source){
 await api('admin/content/replacements',{method:'DELETE',body:JSON.stringify({source_text:source})});
 uiReplacements=uiReplacements.filter(x=>x.source_text!==source);
 toast('Замена удалена. Исходный текст вернётся после обновления экрана.');
 manager()
}
async function saveUiField(key,id){
 const value=$('#'+id).value;
 await api('admin/content',{method:'POST',body:JSON.stringify({key,value})});
 uiText[key]=value;applyChromeText();toast('Текст сохранён')
}
async function resetUiField(key){
 await api('admin/content',{method:'DELETE',body:JSON.stringify({key})});
 delete uiText[key];toast('Возвращено стандартное значение');manager()
}
async function saveAllUi(){
 const items=UI_FIELDS.map(([,key,,def])=>({key,value:$('#ui_'+key.replace(/\./g,'_'))?.value??T(key,def)}));
 await api('admin/content/bulk',{method:'POST',body:JSON.stringify({items})});
 for(const x of items)uiText[x.key]=x.value;
 applyChromeText();toast('Все изменения сохранены');manager()
}


function messengerAdmin(){
 return `<div class=card>
   <h2>Управление мессенджером</h2>
   <p class=muted>Доступ к чатам имеет только тот сотрудник, которому управляющий явно включил разрешение.</p>
   <button class="btn red" onclick="loadMessengerAdmin()">Обновить данные</button>
   <div id=messengerAdminBox style="margin-top:14px">Нажмите «Обновить данные».</div>
 </div>`
}
async function loadMessengerAdmin(){
 const box=$('#messengerAdminBox');if(!box)return;
 try{
  const r=await api('admin/messenger');
  box.innerHTML=`<h3>Доступ сотрудников</h3>${r.users.map(u=>`<div class="listitem row"><img class=avatar src="${u.photo||'/assets/logo.png'}"><div style="flex:1"><b>${esc(u.name)}</b><br><small>${esc(u.position)} · ${u.active?'активен':'заблокирован'}${u.last_seen?' · был(а) '+new Date(u.last_seen).toLocaleString('ru'):''}</small></div><label><input class=messenger-access-check type=checkbox data-employee-id="${u.id}" ${u.messenger_access?'checked':''}> Доступ к чатам</label></div>`).join('')}
  <div class="row" style="margin-top:14px">
    <button class="btn red" onclick="saveMessengerAccess()">Сохранить доступ сотрудников</button>
    <span id=messengerAccessSaveStatus class=muted></span>
  </div>
  <h3 style="margin-top:20px">Чаты</h3>${r.chats.length?r.chats.map(c=>`<div class="listitem row"><div style="flex:1"><b>${esc(c.type==='group'?(c.title||'Группа'):'Личный чат')}</b><br><small>${c.members_count} участников · ${c.messages_count} сообщений</small></div><button class="btn danger" onclick="deleteAdminChat(${c.id})">Удалить чат</button></div>`).join(''):'<p class=muted>Чатов пока нет.</p>'}`;
 }catch(e){box.innerHTML=`<div class=card>${esc(e.message)}</div>`}
}
async function saveMessengerAccess(){
 const checks=[...document.querySelectorAll('.messenger-access-check')];
 const status=$('#messengerAccessSaveStatus');
 if(status)status.textContent='Сохраняю…';
 try{
   for(const ch of checks){
     await api('admin/messenger/access',{
       method:'POST',
       body:JSON.stringify({employee_id:Number(ch.dataset.employeeId),enabled:ch.checked})
     });
   }
   if(status)status.textContent='Сохранено';
   toast('Доступ к мессенджеру сохранён');
   await loadMessengerAdmin();
 }catch(e){
   if(status)status.textContent='Ошибка сохранения';
   toast(e.message||'Не удалось сохранить доступ');
 }
}
async function deleteAdminChat(id){
 if(!confirm('Удалить этот чат и всю переписку?'))return;
 await api('admin/messenger/chat',{method:'DELETE',body:JSON.stringify({id})});
 toast('Чат удалён');await loadMessengerAdmin()
}

function individualAdmin(){return `<div class=card><h2 style="margin-bottom:6px">Назначить индивидуальное задание</h2><p class="muted" style="margin-top:0">Персональная задача с дедлайном и бонусными баллами.</p><select id=ie class=field>${state.employees.filter(e=>e.active).map(e=>`<option value=${e.id}>${esc(e.name)} — ${esc(e.position)}</option>`).join('')}</select><input id=it class=field placeholder="Название"><textarea id=idsc class=field placeholder="Описание"></textarea><div class=grid><input id=ipts class=field type=number placeholder="Баллы"><input id=idue class=field type=date></div><button class="btn red" onclick="addIndividual()">Назначить</button></div>${(state.individualTasks||[]).map(t=>`<div class="card task-personal"><b>${esc(t.employee_name)} — ${esc(t.title)}</b><p>${esc(t.description)}</p><span class=pill>+${t.points}</span> ${t.due_date?`<small>до ${new Date(t.due_date).toLocaleDateString('ru')}</small>`:''}<p><b>Статус:</b> ${t.status}${t.employee_comment?`<br><i>Комментарий сотрудника: ${esc(t.employee_comment)}</i>`:''}</p>${t.status==='submitted'?`<button class="btn red" onclick="approveIndividual(${t.id})">Подтвердить и начислить</button>`:''} <button class="btn danger" onclick="deleteIndividual(${t.id})">Удалить</button></div>`).join('')}`}
async function addIndividual(){await api('admin/individual-tasks',{method:'POST',body:JSON.stringify({employee_id:+$('#ie').value,title:$('#it').value,description:$('#idsc').value,points:+$('#ipts').value,due_date:$('#idue').value||null})});toast('Индивидуальное задание назначено');manager()}
async function approveIndividual(id){let r=await api('admin/individual-tasks/approve',{method:'POST',body:JSON.stringify({id})});pointCelebration(r.points);toast('Задание подтверждено, баллы начислены');manager()}
async function deleteIndividual(id){if(!confirm('Удалить индивидуальное задание?'))return;await api('admin/individual-tasks',{method:'DELETE',body:JSON.stringify({id})});manager()}
function competitionAdmin(){let c=state.competition;return `<div class=card><h2>Гонка экипажей</h2><label>Название</label><input id=coTitle class=field value="${esc(c?.title||'Гонка экипажей')}"><label>Правила / описание</label><textarea id=coDesc class=field>${esc(c?.description||'')}</textarea><div class=grid><div><label>Начало</label><input id=coStart class=field type=date value="${c?.starts_on?String(c.starts_on).slice(0,10):''}"></div><div><label>Окончание</label><input id=coEnd class=field type=date value="${c?.ends_on?String(c.ends_on).slice(0,10):''}"></div></div><label><input id=coActive type=checkbox ${c?.active!==false?'checked':''}> Конкурс активен</label><br><br><button class="btn red" onclick="saveCompetition()">Сохранить конкурс</button></div><div class=grid><div class=card><h3>Задания конкурса</h3><input id=cot class=field placeholder="Название задания"><textarea id=cod class=field placeholder="Описание"></textarea><input id=cop class=field type=number placeholder="Баллы"><button class=btn onclick="addCompetitionTask()">Добавить задание</button>${(c?.tasks||[]).map(t=>`<div class=listitem><b>${esc(t.title)}</b> +${t.points}<br><small>${esc(t.description)}</small><br><button class="btn danger" onclick="delCompetitionTask(${t.id})">Удалить</button></div>`).join('')}</div><div class=card><h3>Начислить бонус</h3><select id=coe class=field>${state.employees.filter(e=>e.active).map(e=>`<option value=${e.id}>${esc(e.name)}</option>`).join('')}</select><select id=cotask class=field><option value="">Произвольный бонус</option>${(c?.tasks||[]).map(t=>`<option value="${t.id}" data-p="${t.points}">${esc(t.title)} (+${t.points})</option>`).join('')}</select><input id=copts class=field type=number placeholder="Баллы"><input id=coreason class=field placeholder="Причина"><button class="btn red" onclick="awardCompetition()">Начислить</button><h3>Рейтинг конкурса</h3>${(c?.board||[]).map((x,i)=>`<div class=listitem>${i+1}. <b>${esc(x.name)}</b> — ${x.score}</div>`).join('')}</div></div>`}
async function saveCompetition(){let r=await api('admin/competition/settings',{method:'POST',body:JSON.stringify({title:$('#coTitle').value,description:$('#coDesc').value,starts_on:$('#coStart').value||null,ends_on:$('#coEnd').value||null,active:$('#coActive').checked})});toast(r.push&&r.push.sent>0?`Конкурс сохранён · уведомлений: ${r.push.sent}`:'Конкурс сохранён');manager()}
async function addCompetitionTask(){await api('admin/competition/tasks',{method:'POST',body:JSON.stringify({title:$('#cot').value,description:$('#cod').value,points:+$('#cop').value})});manager()}
async function delCompetitionTask(id){if(!confirm('Удалить задание?'))return;await api('admin/competition/tasks',{method:'DELETE',body:JSON.stringify({id})});manager()}
async function awardCompetition(){let s=$('#cotask'),o=s.options[s.selectedIndex],pts=+$('#copts').value||+(o?.dataset?.p||0),reason=$('#coreason').value||(o&&o.value?o.textContent:'Бонус конкурса');if(!pts)return toast('Укажите баллы');await api('admin/competition/award',{method:'POST',body:JSON.stringify({employee_id:+$('#coe').value,task_id:+s.value||null,points:pts,reason})});pointCelebration(pts);toast('Баллы начислены');manager()}
function newsAdmin(){return `<div class=card><h2 style="margin-bottom:6px">Новая публикация</h2><p class="muted" style="margin-top:0">Новости, объявления и важная информация для команды.</p><input id=nt class=field placeholder="Заголовок"><select id=nc class=field><option>Важно</option><option>Мероприятие</option><option>Новинка</option><option>Обучение</option><option>Для команды</option></select><textarea id=nb class=field placeholder="Текст новости"></textarea><label>Дата мероприятия (необязательно)</label><input id=nd class=field type=date><label>Фото</label><input id=nimg class=field type=file accept="image/*"><div class=row><label><input id=np type=checkbox> Закрепить</label><label><input id=na type=checkbox> Требовать «Ознакомился»</label></div><br><button class="btn red" onclick="addNews()">Опубликовать</button></div>${state.news.map(n=>`<div class=card>${n.image?`<img class=newsimg src="${n.image}">`:''}<span class=pill>${esc(n.category)}</span><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><small>Ознакомились: ${n.read_count}</small><br><button class="btn danger" onclick="del('news',${n.id})">Удалить</button></div>`).join('')}`}
function addNews(){file64($('#nimg'),async p=>{let r=await api('admin/news',{method:'POST',body:JSON.stringify({title:$('#nt').value,category:$('#nc').value,body:$('#nb').value,event_date:$('#nd').value||null,image:p,pinned:$('#np').checked,requires_ack:$('#na').checked,active:true})});toast(r.push&&r.push.sent>0?`Новость опубликована · уведомлений: ${r.push.sent}`:'Новость опубликована');manager()})}
async function del(kind,id){if(!confirm('Удалить?'))return;await api('admin/'+kind,{method:'DELETE',body:JSON.stringify({id})});manager()}async function saveSettings(){await api('admin/settings',{method:'POST',body:JSON.stringify({season:$('#season').value,level_step:+$('#levelstep').value,manager_pin:$('#newmpin').value||null})});toast('Настройки сохранены');manager()}

async function supervisor(){try{state=await api('supervisor/state');$('#who').innerHTML=`<span class=supervisor-badge>Наблюдатель</span> <button class="btn light" onclick="logout()">Выйти</button>`;renderSupervisor()}catch{logout()}}
function renderSupervisor(){let team=state.employees.filter(e=>e.team_member),others=state.employees.filter(e=>!e.team_member);$('#app').innerHTML=`<div class="card hero"><h2>Панель руководителя</h2><p>Просмотр прогресса команды без доступа к начислению баллов и изменению настроек.</p></div><div class=grid><div class=card><h3>Команда</h3>${team.map((e,i)=>`<div class="listitem row"><b>${i+1}</b><img class=avatar src="${e.photo||'/assets/logo.png'}"><span>${esc(e.name)}<br><small>${esc(e.position)}</small></span><b style="margin-left:auto">${e.points}</b></div>`).join('')}</div><div class=card><h3>Текущие задания</h3>${state.pending.map(t=>`<div class=listitem><b>${esc(t.employee_name)}</b> — ${esc(t.title)}<br><small>${t.status==='submitted'?'На проверке':'Назначено'}${t.due_date?' · до '+new Date(t.due_date).toLocaleDateString('ru'):''}</small></div>`).join('')||'Нет активных заданий'}</div></div><div class=grid><div class=card><h3>Последние достижения</h3>${state.achievements.slice(0,30).map(a=>{let e=state.employees.find(x=>x.id===a.employee_id);return `<div class=listitem>${esc(a.icon)} <b>${esc(e?.name||'')}</b> — ${esc(a.title)}</div>`}).join('')||'Пока нет достижений'}</div><div class=card><h3>Конкурс</h3>${state.competition?state.competition.board.map((x,i)=>`<div class=listitem>${i+1}. <b>${esc(x.name)}</b> — ${x.score}</div>`).join(''):'Нет активного конкурса'}${others.length?`<hr><small>Не участвуют в рейтинге: ${others.map(x=>esc(x.name)).join(', ')}</small>`:''}</div></div>`;animateSection()}

(async()=>{await loadUiText();applyChromeText();startReplacementObserver();const q=new URLSearchParams(location.search),open=q.get('open');if(['tasks','news','competition','messenger'].includes(open))etab=open;if(token&&role==='employee')employee();else if(token&&role==='supervisor')supervisor();else if(token&&role==='manager')manager();else login()})();
</script></body></html>
